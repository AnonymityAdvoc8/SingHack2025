[project]
name = "travelmate-backend"
version = "1.0.0"
description = "TravelMate AI - Backend MCP Server"
authors = [
    {name = "Ancileo × MSIG", email = "team@ancileo.com"}
]
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

